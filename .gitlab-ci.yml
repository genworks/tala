# GitLab CI for genworks/tala: the Lisp half of the regression suite
# (tests/run.lisp) on a COLD Gendl image, once per implementation.  The
# golden checksum holds the two implementations to the same frames.
#
# The browser half (tests/browser.sh: the worklet against the Lisp
# render, in headless Chromium) needs a running image and a browser
# beside it; it runs where the stack is, not here, for now.
#
# The repository is push-mirrored to other GitLab servers that carry
# this file too but have no such runner, so the pipeline exists on the
# home server alone.

workflow:
  rules:
    - if: $CI_SERVER_HOST == "gitlab.genworks.com"

stages:
  - fetch
  - test

# The invite gate and sexp-agent live in Gendl (gwl/source/); until the
# images carry them, the two files come from Gendl's repository by git,
# which common-lisp.net's bot screen lets through where it answers curl
# with a challenge page.  The Gendl images have no git, so a job of its
# own fetches them.
gendl-files:
  stage: fetch
  tags:
    - amd64-docker
  image:
    name: alpine/git:latest
    entrypoint: [""]
  variables:
    GIT_STRATEGY: none
  script:
    - rm -rf gendl-partial gendl-files
    - git clone --depth 1 --filter=blob:none --no-checkout -b devo https://gitlab.common-lisp.net/gendl/gendl.git gendl-partial
    - git -C gendl-partial checkout devo -- gwl/source/invite-gate.lisp gwl/source/sexp-agent.lisp
    - mkdir gendl-files && cp gendl-partial/gwl/source/invite-gate.lisp gendl-partial/gwl/source/sexp-agent.lisp gendl-files/
    - for f in gendl-files/*.lisp; do head -c 120 "$f" | grep -q Copyright || { echo "$f is not the Lisp file"; exit 1; }; done
    - git -C gendl-partial log --oneline -1
  artifacts:
    paths:
      - gendl-files/
    expire_in: 1 day

.lisp-tests:
  stage: test
  needs:
    - gendl-files
  tags:
    - amd64-docker
  variables:
    GIT_DEPTH: "1"
    INVITE_GATE_FILE: /tmp/tala/gendl-files/invite-gate.lisp
    SEXP_AGENT_FILE: /tmp/tala/gendl-files/sexp-agent.lisp
  before_script:
    # A private copy: the build directory belongs to the runner's helper,
    # not the image's user.  The fetched Gendl files ride along in it.
    - rm -rf /tmp/tala && cp -r "$CI_PROJECT_DIR" /tmp/tala
    - cd /opt/gendl

tests-ccl:
  extends: .lisp-tests
  image: genworks/gendl:devo-ccl
  script:
    - TALA_DIR=/tmp/tala ./gdl/program/gdl-ccl -n -b --load /tmp/tala/ci/run-tests.lisp

tests-sbcl:
  extends: .lisp-tests
  image: genworks/gendl:devo-sbcl
  script:
    - TALA_DIR=/tmp/tala ./gdl/program/gdl-sbcl --non-interactive --load /tmp/tala/ci/run-tests.lisp
